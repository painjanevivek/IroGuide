name: Prelaunch DAST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: Staging DAST gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAST_BASE_URL: ${{ vars.IROGUIDE_STAGING_URL || secrets.IROGUIDE_STAGING_URL }}
      DAST_REQUIRE_READY: "true"
      DAST_REPORT_PATH: artifacts/dast-prelaunch-report.json

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify staging URL configuration
        run: |
          if [ -z "${DAST_BASE_URL}" ]; then
            echo "Configure vars.IROGUIDE_STAGING_URL or secrets.IROGUIDE_STAGING_URL before running this workflow." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run prelaunch DAST
        run: npm run dast:prelaunch

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-prelaunch-report
          path: artifacts/dast-prelaunch-report.json
          if-no-files-found: warn
