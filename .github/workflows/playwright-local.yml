name: Local Playwright

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: local-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Deterministic local Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_AUTH_MODE: local
      IROGUIDE_REVIEW_PROVIDER: demo
      NEXT_PUBLIC_E2E_LOCAL_AUTH: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run local Playwright suite
        run: npm run test:e2e

      - name: Run free-launch Playwright contract
        run: npm run test:e2e:free

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
